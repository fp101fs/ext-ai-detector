<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Detector</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container">
  <h1>AI Detector</h1>

  <!-- Auth Section -->
  <div class="section auth-section" id="authSection">
    <div id="signedOut">
      <p class="auth-hint">Sign in for free AI detection — no API key needed</p>
      <button id="signInBtn" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
          <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.547 0 9s.348 2.825.957 4.039l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
    </div>
    <div id="signedIn" class="hidden">
      <div class="user-info">
        <span id="userName"></span>
        <button id="signOutBtn" class="btn-sm">Sign out</button>
      </div>
    </div>
  </div>

  <!-- Divider -->
  <div class="divider" id="orDivider">
    <span>or use your own key</span>
  </div>

  <div class="section" id="apiKeySection">
    <h2>OpenRouter API Key</h2>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="sk-or-v1-...">
      <button id="saveKey">Save</button>
    </div>
    <span id="keyStatus" class="status"></span>
  </div>

  <div class="section">
    <h2>Detection Mode</h2>
    <label>
      <input type="radio" name="mode" value="openrouter" checked>
      OpenRouter (AI-powered)
    </label>
    <label>
      <input type="radio" name="mode" value="heuristic">
      Heuristic only (offline)
    </label>
    <label>
      <input type="radio" name="mode" value="hybrid">
      Hybrid (best accuracy)
    </label>
  </div>

  <div class="section">
    <h2>Scan Options</h2>
    <label>
      Min paragraph length (words):
      <input type="number" id="minWords" value="20" min="5" max="500">
    </label>
    <label>
      Max paragraphs to scan:
      <input type="number" id="maxParagraphs" value="50" min="5" max="200">
    </label>
  </div>

  <button id="scanBtn">Scan This Page</button>

  <div id="results" class="results hidden">
    <h2>Results</h2>
    <div class="score-container">
      <div class="score-circle" id="scoreCircle">--</div>
      <div class="score-label" id="scoreLabel">AI Probability</div>
    </div>
    <div id="paragraphResults"></div>
    <div id="summary"></div>
  </div>

  <div id="loading" class="loading hidden">Scanning page</div>
</div>
<script src="popup.js"></script>
</body>
</html>
