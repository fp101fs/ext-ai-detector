<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Scan — AI Detector</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo-title">
      <span class="logo-icon">🔍</span>
      <h2>AI Scan</h2>
    </div>
    <span class="version-badge">GPTZero + ZeroGPT Hybrid</span>
  </div>

  <!-- Settings Accordion / Panel -->
  <div class="section">
    <div class="section-title">OpenRouter API Key (BYOK)</div>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off">
      <button id="saveKey" class="btn btn-primary">Save</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
      <span id="keyStatus" class="status"></span>
      <a href="https://ai-scan-backend.vercel.app/api/auth/openrouter/login" target="_blank" class="link-small">Get Key (1-Click) &rarr;</a>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Detection Mode</div>
    <div class="radio-group">
      <label class="radio-label">
        <input type="radio" name="mode" value="hybrid" checked>
        <span>✨ <strong>Hybrid</strong> (AI + Stylometrics)</span>
      </label>
      <label class="radio-label">
        <input type="radio" name="mode" value="heuristic">
        <span>⚡ <strong>ZeroGPT Heuristics</strong> (Free/No Key)</span>
      </label>
      <label class="radio-label">
        <input type="radio" name="mode" value="openrouter">
        <span>🤖 <strong>Multi-Model AI</strong> (GPTZero-Style)</span>
      </label>
    </div>
  </div>

  <div class="section" id="modelSection">
    <div class="section-title">AI Model</div>
    <select id="detectionModel" class="form-select">
      <option value="openai/gpt-4o-mini">OpenAI GPT-4o Mini (Default)</option>
      <option value="google/gemini-2.5-flash">Google Gemini 2.5 Flash</option>
      <option value="deepseek/deepseek-chat">DeepSeek V3 (Chat)</option>
      <option value="anthropic/claude-3.5-haiku">Anthropic Claude 3.5 Haiku</option>
    </select>
  </div>

  <div class="section">
    <div class="section-title">Page Scan Options</div>
    <div class="options-grid">
      <label>
        Min words / para:
        <input type="number" id="minWords" value="15" min="5" max="200">
      </label>
      <label>
        Max paragraphs:
        <input type="number" id="maxParagraphs" value="50" min="5" max="200">
      </label>
    </div>
  </div>

  <!-- Primary Action -->
  <div class="scan-actions">
    <button id="scanBtn" class="btn btn-primary btn-block">⚡ Scan Active Page</button>
    <button id="stopBtn" class="btn btn-secondary btn-block hidden" type="button">Stop Scanning</button>
  </div>

  <!-- Results View -->
  <div id="results" class="results hidden">
    <div class="score-card">
      <div class="score-circle" id="scoreCircle">--</div>
      <div>
        <div class="score-label" id="scoreLabel">Overall AI Probability</div>
        <div id="verdictText" class="verdict-text">Analyzing content...</div>
      </div>
    </div>

    <!-- Stylometric metric pills -->
    <div class="metrics-grid">
      <div class="metric-box">
        <span class="metric-label">Burstiness</span>
        <strong id="statBurstiness" class="metric-value">--</strong>
      </div>
      <div class="metric-box">
        <span class="metric-label">Perplexity</span>
        <strong id="statPerplexity" class="metric-value">--</strong>
      </div>
      <div class="metric-box">
        <span class="metric-label">Vocab (TTR)</span>
        <strong id="statVocab" class="metric-value">--</strong>
      </div>
    </div>

    <div class="section-title" style="margin-top: 14px;">Paragraphs Highlighted in Page</div>
    <div id="paragraphResults" class="para-list"></div>
    <div id="summary" class="summary-box"></div>
  </div>

  <div id="loading" class="loading hidden" role="status" aria-live="polite">Scanning page...</div>
</div>
<script src="popup.js"></script>
</body>
</html>
